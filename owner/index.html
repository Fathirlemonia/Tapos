<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPOS Owner Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-mark">T</div>
        <div>
          <strong>TAPOS</strong>
          <small>Tap, beres.</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active">Overview</button>
        <button class="nav-item">Live Transactions</button>
        <button class="nav-item">Employee Monitoring</button>
        <button class="nav-item">Shift Management</button>
        <button class="nav-item">Cash Monitoring</button>
        <button class="nav-item">Product Management</button>
        <button class="nav-item">Inventory</button>
        <button class="nav-item">Financial Reports</button>
        <button class="nav-item">Activity Logs</button>
        <button class="nav-item">Settings</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <small class="muted">Warkop Meteora</small>
          <h1>Owner Dashboard</h1>
        </div>
        <div class="topbar-right">
          <span class="status-pill online">Online</span>
          <button id="logoutBtn" class="btn btn-light">Keluar</button>
        </div>
      </header>

      <section class="summary-grid">
        <article class="stat-card"><div class="card-head"><span>Omzet hari ini</span><span class="icon blue">↗</span></div><strong id="salesToday">Rp 0</strong><small class="pos">↑ 0% dari hari sebelumnya</small></article>
        <article class="stat-card"><div class="card-head"><span>Transaksi</span><span class="icon green">▤</span></div><strong id="transactionCount">0</strong><small class="muted">Transaksi masuk</small></article>
        <article class="stat-card"><div class="card-head"><span>Rata-rata transaksi</span><span class="icon amber">◉</span></div><strong id="averageOrder">Rp 0</strong><small class="muted">Nilai rata-rata</small></article>
        <article class="stat-card"><div class="card-head"><span>Produk terjual</span><span class="icon teal">☕</span></div><strong id="itemsSold">0</strong><small class="muted">Total item</small></article>
      </section>

      <section class="board-grid">
        <article class="panel large-panel">
          <div class="panel-head"><h2>Transaksi terbaru</h2><button class="btn btn-light">Lihat semua</button></div>
          <table>
            <thead>
              <tr><th>ID</th><th>WAKTU</th><th>KASIR</th><th>TOTAL</th><th>STATUS</th></tr>
            </thead>
            <tbody id="transactionsTable"></tbody>
          </table>
        </article>

        <article class="panel">
          <div class="panel-head"><h2>Aktivitas</h2></div>
          <div id="activityList" class="activity-list"></div>
        </article>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/dashboard.js"></script>
</body>
</html>
